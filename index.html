<!DOCTYPE html>
<html lang="ms"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>ACD Rabies</title>
<style>
:root{--p:#0f766e;--p2:#14b8a6;--bg:#f1f5f4;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#dbe4e2;--err:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem}header p{margin:2px 0 0;font-size:.8rem;opacity:.9}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
h2{font-size:.95rem;margin:0 0 12px;color:var(--p)}
label{display:block;font-size:.82rem;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px #14b8a633}
.bad{border-color:var(--err)!important}.hint{font-size:.75rem;color:var(--mu);margin-top:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg input{display:none}
.seg span{display:block;padding:10px 14px;border:1.5px solid var(--bd);border-radius:999px;font-size:.85rem;cursor:pointer;user-select:none}
.seg input:checked+span{background:var(--p);border-color:var(--p);color:#fff}
button.b{width:100%;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font:600 1rem inherit;margin-top:16px}
button.b:active{transform:scale(.98)}button.l{background:none;border:0;color:var(--p);font:inherit;padding:8px;margin-top:6px;width:100%}
.ro{background:#ecfdf5;border-radius:12px;padding:12px;font-size:.85rem;line-height:1.5}
.hide{display:none!important}#sg button{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid var(--bd);background:#fff;font:inherit;font-size:.82rem}
#ov{position:fixed;inset:0;background:#0f172acc;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;z-index:99}
#ov.on{display:flex}.sp{width:46px;height:46px;border:4px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:.88rem;z-index:100;opacity:0;pointer-events:none;transition:.3s;max-width:90%}
#toast.on{opacity:1}
.sk{height:44px;border-radius:12px;background:linear-gradient(90deg,#e5ecea 25%,#f3f7f6 50%,#e5ecea 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 5px #2563eb55;position:relative;left:-9px;top:-9px}.me span{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font:600 11px system-ui;padding:3px 8px;border-radius:8px;white-space:nowrap}#map{border-radius:12px;overflow:hidden;z-index:0}
#sg{max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:12px;margin-top:6px}#sg:empty{display:none}
</style></head><body>
<header><h1>🐕 Active Case Detection (ACD) Rabies</h1><p id="sub">Borang pegawai</p></header>
<main id="app"></main>
<div id="ov"><div class="sp"></div><div id="ovt">Sila tunggu…</div></div>
<div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzYv6WQtKPESIUKkJwYEDI4eUYhjokDm6duEQfAxmZ_StlNrgJn7o1_zXuy9L3oFrwZmA/exec';
const $=s=>document.querySelector(s),app=$('#app');
let L={jawatan:[],tempat:[],pkd:[],lokaliti:[]},me=JSON.parse(localStorage.getItem('acd_user')||'null'),gps=null;
const today=()=>{const d=new Date();return[String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),d.getFullYear()].join('/')};
const load=(on,t)=>{$('#ov').classList.toggle('on',on);if(t)$('#ovt').textContent=t};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3200)}
async function call(body,msg,tries=1){load(true,msg);
  try{for(let i=0;i<tries;i++){
    try{const j=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})).json();if(j.busy&&i<tries-1){await new Promise(z=>setTimeout(z,1500*(i+1)+Math.random()*2000));continue}return j}
    catch(e){if(i<tries-1)await new Promise(z=>setTimeout(z,1500*(i+1)+Math.random()*2000))}}
    toast('Ralat rangkaian. Cuba lagi.');return{ok:false}}finally{load(false)}}
const opts=(a,ph)=>`<option value="">${ph||'-- PILIH --'}</option>`+a.map(v=>String(v).toUpperCase()).map(v=>`<option>${v}</option>`).join('')+'<option value="__new">➕ TAMBAH BAHARU…</option>';
const seg=(n,a,t='radio')=>`<div class="seg">${a.map(v=>String(v).toUpperCase()).map(v=>`<label style="margin:0"><input type="${t}" name="${n}" value="${v}"><span>${v}</span></label>`).join('')}</div>`;
const val=n=>(document.querySelector(`[name=${n}]:checked`)||{}).value||'';
function bindNew(){document.querySelectorAll('select[data-new]').forEach(s=>s.onchange=()=>{if(s.value==='__new'){const v=(prompt('Masukkan nama baharu:')||'').trim().toUpperCase();if(v){if(!L[s.dataset.new].includes(v))L[s.dataset.new].push(v);s.insertAdjacentHTML('afterbegin',`<option>${v}</option>`);s.value=v}else s.value=''}})}
function phoneFix(el){el.value=el.value.replace(/\D/g,'').slice(0,11);if(el.value&&el.value[0]!=='0')el.value='0'+el.value}
function icFix(el,alpha){const was=+el.dataset.l||0;el.value=alpha?el.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,12):el.value.replace(/\D/g,'').slice(0,12);el.dataset.l=el.value.length;if(el.value.length===12&&was<12)advance(el)}
let gpsErr=0;
function getGPS(){return new Promise(r=>{
  if(!navigator.geolocation){gpsErr=2;return r(null)}
  const ok=p=>r({lat:p.coords.latitude.toFixed(7),lng:p.coords.longitude.toFixed(7),t:new Date().toLocaleString('en-GB'),acc:Math.round(p.coords.accuracy),ts:Date.now()});
  navigator.geolocation.getCurrentPosition(ok,e=>{gpsErr=e.code;if(e.code===1)return r(null);
    navigator.geolocation.getCurrentPosition(ok,e2=>{gpsErr=e2.code;r(null)},{enableHighAccuracy:false,maximumAge:60000,timeout:15000})},{enableHighAccuracy:true,maximumAge:0,timeout:15000})})}
function need(ids){let ok=true;ids.forEach(i=>{const e=document.getElementById(i);const bad=!e.value.trim();e.classList.toggle('bad',bad);if(bad)ok=false});if(!ok)toast('Sila lengkapkan ruangan bertanda merah');return ok}

async function init(){
  loadAddr();
  app.innerHTML='<div class="card"><div class="sk"></div><br><div class="sk"></div><br><div class="sk"></div></div>';
  try{const r=await(await fetch(API)).json();L=r.lists}catch(e){toast('Tidak dapat memuatkan senarai')}
  me?enter():loginView();
}
function loginView(){
  $('#sub').textContent='Log masuk';
  app.innerHTML=`<div class="card"><h2>Log masuk pegawai</h2><label>No. Kad Pengenalan</label><input id="lic" inputmode="numeric" oninput="icFix(this)"><button class="b" id="bl">Log masuk</button><button class="l" id="bs">Pengguna baharu? Daftar</button></div>`;
  $('#bl').onclick=async()=>{if(!need(['lic']))return;if($('#lic').value.length!==12)return toast('IC mesti 12 digit');const r=await call({action:'login',ic:$('#lic').value},'Menyemak…');
    if(r.ok){me=r.user;localStorage.setItem('acd_user',JSON.stringify(me));enter()}else toast(r.notFound?'IC tidak dijumpai. Sila daftar.':'Ralat')};
  $('#bs').onclick=signupView;
}
function signupView(){
  $('#sub').textContent='Pendaftaran pengguna baharu';
  app.innerHTML=`<div class="card"><h2>Daftar pegawai</h2>
  <label>Nama</label><input id="sn" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" autocomplete="name">
  <label>No. Kad Pengenalan</label><input id="si" inputmode="numeric" oninput="icFix(this)">
  <label>No. Telefon</label><input id="st" inputmode="tel" value="01" oninput="phoneFix(this)">
  <label>Jawatan</label><select id="sj" data-new="jawatan">${opts(L.jawatan)}</select>
  <label>Tempat Bertugas</label><select id="sp" data-new="tempat">${opts(L.tempat)}</select>
  <label>PKD</label><select id="sk" data-new="pkd">${opts(L.pkd)}</select>
  
  <button class="b" id="ss">Daftar &amp; Mula</button><button class="l" id="bb">Kembali</button></div>`;
  bindNew();$('#bb').onclick=loginView;
  $('#ss').onclick=async()=>{if(!need(['sn','si','st','sj','sp','sk']))return;
    if($('#si').value.length!==12){$('#si').classList.add('bad');return toast('IC mesti 12 digit')}if(!/^(01\d{8,9}|0[3-9]\d{7,8})$/.test($('#st').value)){$('#st').classList.add('bad');return toast('No. telefon tidak sah (cth: 0123456789 atau 0471234567)')}$('#st').classList.remove('bad');
    load(true,'Meminta kebenaran lokasi & kamera…');
    gps=await getGPS();if(!gps){load(false);return toast('Kebenaran lokasi diperlukan untuk mendaftar')}
    try{const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop())}catch(e){}
    const u={nama:$('#sn').value.trim(),ic:$('#si').value,tel:$('#st').value,jawatan:$('#sj').value,tempat:$('#sp').value,pkd:$('#sk').value,lat:gps&&gps.lat,lng:gps&&gps.lng};
    const r=await call({action:'signup',user:u},'Mendaftar…');
    if(r.ok){me=r.user;localStorage.setItem('acd_user',JSON.stringify(me));toast('Pendaftaran berjaya');enter()}else toast(r.error||'Gagal daftar')};
}
function form(){
  $('#sub').textContent='Borang ACD';
  const ynt=n=>seg(n,['Ya','Tidak']);
  app.innerHTML=`<div class="card"><h2>Pegawai pelapor</h2><div class="ro"><b>${me.nama}</b><br>${me.jawatan} · ${me.tel}<br>Tarikh ACD: ${today()}</div><button class="l" id="lo">Bukan anda? Log keluar</button></div>
  <div class="card"><h2>Maklumat penghuni</h2>
  <label>Alamat (taip jalan/taman untuk cari senarai MPKP atau enter manual)</label><textarea id="al" rows="2" autocomplete="off" oninput="this.value=this.value.toUpperCase();srch()"></textarea><div id="sg"></div><div id="fl" class="ro hide" style="background:#fef3c7;margin-top:8px"></div>
  <label>Lokaliti</label><select id="lok" data-new="lokaliti">${opts(L.lokaliti)}</select>
  <label>Nama penuh penghuni</label><input id="nm" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
  <label>No. Kad Pengenalan/Passport</label><input id="ic" autocapitalize="characters" oninput="icFix(this,1)">
  <label>No. Telefon</label><input id="tl" inputmode="tel" value="01" oninput="phoneFix(this)">
  <label>Jumlah isi rumah (nombor sahaja)</label><input id="ir" type="number" inputmode="numeric" min="1"></div>
  <div class="card"><h2>Haiwan peliharaan</h2>
  <label>Ada bela haiwan peliharaan? (jika ya, nyatakan)</label><input id="be">
  <label>Terima vaksin rabies untuk haiwan peliharaan?</label>${seg('vk',['Ya','Tidak','Tiada haiwan'])}
  <label>Pernah melihat bangkai atau haiwan berkelakuan tidak normal (kawasan berdekatan)?</label>${ynt('bk')}
  <label>Pernah digigit haiwan dalam masa 3 bulan sebelum?</label>${ynt('gg')}</div>
  <div class="card hide" id="bite"><h2>Butiran gigitan</h2>
  <label>Jenis haiwan</label>${seg('jn',['Haiwan peliharaan','Haiwan liar'])}
  <label>Nama individu yang digigit</label><input id="ng">
  <label>Tarikh digigit</label><input id="tg" type="date">
  <label>Anggota badan yang digigit</label><input id="ab">
  <label>Bilangan dos suntikan vaksin PEP</label>${seg('ds',['Tidak menerima suntikan','1','2','3','4'])}
  <label>Status haiwan</label>${seg('sh',['Vaksin','Tidak divaksin','Tidak diketahui'])}
  <label>Status PEP</label>${seg('sp2',['Diberi','Tidak diberi','Tidak berkaitan'])}
  <label>Status luka</label>${seg('sl',['Sembuh','Tidak sembuh','Tidak berkaitan'])}</div>
  <div class="card"><h2>Pendidikan kesihatan &amp; catatan</h2>
  <label>Aktiviti pendidikan kesihatan diberikan</label>${seg('ak',['Lisan','Konsultasi individu','Risalah','Dialog','Video','Poster/Fish tail/Banner','Perbincangan kumpulan kecil'],'checkbox')}
  <label>Catatan tambahan (jika ada)</label><textarea id="ct" rows="3"></textarea>
  
  <label>Lokasi geotag anda</label><div id="map" class="sk" style="height:220px"></div><div class="hint" id="gi"></div><button class="b" id="sub2">Hantar</button></div>`;
  bindNew();
  $('#lo').onclick=()=>{if(wid!=null){navigator.geolocation.clearWatch(wid);wid=null}localStorage.removeItem('acd_user');me=null;loginView()};
  document.querySelectorAll('[name=gg]').forEach(r=>r.onchange=()=>$('#bite').classList.toggle('hide',val('gg')!=='YA'));
  $('#sub2').onclick=submit;mountMap();
}
async function submit(){
  if(!need(['lok','nm','ic','tl','al','ir']))return;const ic=$('#ic').value.trim();if(!/^[A-Za-z0-9]{1,12}$/.test(ic)){$('#ic').classList.add('bad');return toast('No. Kad Pengenalan/Passport tidak sah')}$('#ic').classList.remove('bad');if(!/^(01\d{8,9}|0[3-9]\d{7,8})$/.test($('#tl').value)){$('#tl').classList.add('bad');return toast('No. telefon tidak sah (cth: 0123456789 atau 0471234567)')}$('#tl').classList.remove('bad');
  if(!val('vk')||!val('bk')||!val('gg'))return toast('Sila jawab semua soalan Ya/Tidak');
  const g=val('gg')==='YA';
  if(g&&(!val('jn')||!val('ds')||!val('sh')||!val('sp2')||!val('sl')||!$('#ng').value||!$('#tg').value||!$('#ab').value))return toast('Lengkapkan butiran gigitan');
  load(true,'Merekod lokasi GPS…');let p=await getGPS();if(!p&&pos&&Date.now()-pos.ts<30000)p=pos;if(!p){load(false);return toast('Lokasi tidak dapat dikesan. Hidupkan GPS dan benarkan lokasi.')}
  const d={tarikh:today(),pegawai:me.nama,jawatan:me.jawatan,telPegawai:me.tel,lokaliti:$('#lok').value,nama:$('#nm').value.trim(),ic:$('#ic').value,tel:$('#tl').value,alamat:$('#al').value.trim().toUpperCase(),isiRumah:$('#ir').value,bela:$('#be').value.trim()||'TIDAK',vaksin:val('vk'),bangkai:val('bk'),gigit:val('gg'),catatan:$('#ct').value.trim(),aktiviti:[...document.querySelectorAll('[name=ak]:checked')].map(e=>e.value),lat:p&&p.lat,lng:p&&p.lng,gpsMasa:p&&p.t};
  if(g){const t=$('#tg').value.split('-');Object.assign(d,{jenis:val('jn'),digigit:$('#ng').value.trim(),tarikhGigit:t.reverse().join('/'),anggota:$('#ab').value.trim(),dos:val('ds'),statusHaiwan:val('sh'),statusPep:val('sp2'),statusLuka:val('sl')})}
  sid=sid||(Date.now().toString(36)+Math.random().toString(36).slice(2,8));const r=await call({action:'submit',id:sid,data:d},'Menghantar…',4);if(r.ok)sid=null;
  if(r.ok){const i=A.findIndex(x=>x[0]===d.alamat),row=[d.alamat,d.nama,d.ic,d.tel,d.lokaliti,d.tarikh,me.nama];if(i>=0)A[i]=row;else A.push(row);setA(A);try{localStorage.setItem('acd_addr',JSON.stringify(A))}catch(e){}lastLok=d.lokaliti;toast('✅ Berjaya dihantar'+(p?'':' (tanpa GPS)'));window.scrollTo({top:0,behavior:'smooth'});form();$('#lok').value=lastLok}else toast(r.error||'Gagal hantar')
}
let A=[],K=[],M=[],lastLok='';
function setA(r){A=r;K=r.map(x=>(x[0]+' '+x[1]+' '+x[2]).toUpperCase())}
async function loadAddr(){
  try{setA(JSON.parse(localStorage.getItem('acd_addr')||'[]'))}catch(e){}
  try{const r=await(await fetch(API+'?action=addr')).json();if(r.ok){setA(r.rows);try{localStorage.setItem('acd_addr',JSON.stringify(r.rows))}catch(e){}}}catch(e){}
}
function srch(){
  const q=$('#al').value.trim(),sg=$('#sg');$('#fl').classList.add('hide');
  if(q.length<2){sg.innerHTML='';return}
  M=[];for(let i=0;i<K.length&&M.length<50;i++)if(K[i].includes(q))M.push(i);
  sg.innerHTML=(M.length>=50?'<div class="hint" style="padding:8px 11px;margin:0">Menunjukkan 50 padanan pertama. Taip lebih lanjut untuk mengecilkan.</div>':'')+M.map(i=>`<button type="button" onclick="pick(${i})">${A[i][0]}${A[i][1]?'<br><small>'+A[i][1]+'</small>':''}${A[i][5]?' ✅':''}</button>`).join('')+`<button type="button" onclick="manual()" style="color:var(--p);font-weight:600;position:sticky;bottom:0;background:#f0fdfa">✍️ ${M.length?'Tiada dalam senarai? ':'Tiada padanan. '}Isi manual</button>`;
}
function manual(){$('#sg').innerHTML='';$('#lok').focus()}
function pick(i){
  const r=A[i];$('#sg').innerHTML='';$('#al').value=r[0];$('#nm').value=r[1]||'';$('#ic').value=r[2]||'';$('#tl').value=r[3]||'01';
  if(r[4]){const lk=r[4].toUpperCase();if(![...$('#lok').options].some(o=>o.value===lk)){L.lokaliti.push(lk);$('#lok').insertAdjacentHTML('afterbegin',`<option>${lk}</option>`)}$('#lok').value=lk}
  const f=$('#fl');if(r[5]){f.innerHTML=`⚠️ Alamat ini telah diisi pada <b>${r[5]}</b> oleh <b>${r[6]}</b>`;f.classList.remove('hide')}else f.classList.add('hide');
  const n=['lok','nm','ic','tl','ir'].map(x=>$('#'+x)).find(e=>!e.value||e.value==='01');(n||$('#ir')).focus({preventScroll:true});
}
function advance(el){
  const seen={},list=[...app.querySelectorAll('input,select,textarea')].filter(e=>(e.type==='radio'?e.closest('.seg'):e).offsetParent&&e.type!=='checkbox'&&(e.type!=='radio'||(seen[e.name]?false:(seen[e.name]=1))));
  const i=list.findIndex(e=>e===el||(el.type==='radio'&&e.name===el.name)),n=list[i+1];if(i<0||!n)return;
  if(n.type==='radio')n.closest('.seg').scrollIntoView({block:'center',behavior:'smooth'});else n.focus()
}
app.addEventListener('change',e=>{const t=e.target;if(t.type==='radio'||(t.tagName==='SELECT'&&t.value&&t.value!=='__new'))setTimeout(()=>advance(t),120)});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&!['TEXTAREA','BUTTON'].includes(e.target.tagName)){e.preventDefault();advance(e.target)}});
let sid=null,pos=null,wid=null,map=null,mk=null,ci=null;
async function enter(){load(true,'Mengesan lokasi GPS…');const p=await getGPS();load(false);if(!p)return gateView();pos=p;startWatch();form()}
function gateView(){
  const ua=navigator.userAgent,ios=/iP(hone|ad|od)/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),saf=ios&&!/CriOS|FxiOS|EdgiOS/.test(ua);
  const why=gpsErr===1?'Kebenaran lokasi ditolak.':'GPS tidak dapat dikesan.';
  const how=saf?`<li>Buka <b>Settings</b> &gt; <b>Privacy &amp; Security</b> &gt; <b>Location Services</b> dan hidupkan.</li><li>Dalam senarai yang sama, pilih <b>Safari Websites</b> &gt; <b>While Using the App</b>.</li><li>Dalam Safari, ketik <b>aA</b> &gt; <b>Website Settings</b> &gt; <b>Location</b> &gt; <b>Allow</b>.</li>`:ios?`<li>Buka <b>Settings</b> &gt; <b>Privacy &amp; Security</b> &gt; <b>Location Services</b> dan hidupkan.</li><li>Pilih aplikasi pelayar anda dan tetapkan <b>While Using the App</b>.</li>`:`<li>Hidupkan <b>Lokasi / GPS</b> pada telefon.</li><li>Ketik ikon di sebelah alamat laman &gt; <b>Kebenaran</b> &gt; <b>Lokasi</b> &gt; <b>Benarkan</b>.</li>`;
  $('#sub').textContent='Lokasi diperlukan';
  app.innerHTML=`<div class="card"><div style="font-size:2.6rem;text-align:center">📍</div><h2 style="text-align:center">${why}</h2><p style="font-size:.88rem;line-height:1.5">Borang tidak boleh digunakan tanpa lokasi GPS. Sila:</p><ol style="font-size:.88rem;line-height:1.7;padding-left:20px">${how}<li>Kembali ke sini dan tekan <b>Cuba lagi</b>.</li></ol><button class="b" id="rt">Cuba lagi</button></div>`;
  $('#rt').onclick=enter;
  if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(st=>{st.onchange=()=>{if(st.state==='granted')enter()}}).catch(()=>{});
}
function startWatch(){
  if(wid!=null||!navigator.geolocation)return;
  wid=navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude.toFixed(7),lng:p.coords.longitude.toFixed(7),acc:Math.round(p.coords.accuracy),t:new Date().toLocaleString('en-GB'),ts:Date.now()};updMap()},
    ()=>{const g=$('#gi');if(g)g.textContent='⚠️ Lokasi tidak dapat dikesan. Hidupkan GPS.'},{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
function loadLeaflet(){return new Promise(res=>{if(window.L&&window.L.map)return res();
  const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.append(c);
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=res;s.onerror=res;document.head.append(s)})}
async function mountMap(){
  const el=$('#map');if(!el||!pos)return;await loadLeaflet();const LF=window.L;
  if(!LF||!LF.map){el.textContent='Peta tidak dapat dimuatkan';return}
  if(map){try{map.remove()}catch(e){}map=null}
  el.classList.remove('sk');
  map=LF.map(el,{zoomControl:false}).setView([pos.lat,pos.lng],17);
  LF.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  mk=LF.marker([pos.lat,pos.lng],{icon:LF.divIcon({className:'',html:'<div class="me"><span>Anda di sini</span></div>',iconSize:[0,0]})}).addTo(map);
  ci=LF.circle([pos.lat,pos.lng],{radius:pos.acc||20,color:'#2563eb',weight:1,fillOpacity:.1}).addTo(map);
  setTimeout(()=>map&&map.invalidateSize(),300);updMap();
}
function updMap(){
  const g=$('#gi');if(!map||!pos)return;
  mk.setLatLng([pos.lat,pos.lng]);ci.setLatLng([pos.lat,pos.lng]).setRadius(pos.acc||20);map.setView([pos.lat,pos.lng]);
  if(g)g.textContent=`📍 Lokasi semasa anda (±${pos.acc} m) akan direkodkan semasa hantar`;
}
init();
</script></body></html>
